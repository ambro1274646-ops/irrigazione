<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accedi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#233d24;
    --forest-2:#2d4a2b;
    --sage:#7a9660;
    --wheat:#e3b74f;
    --wheat-light:#f0d089;
    --cream:#f8f4e8;
    --cream-2:#efe8d6;
    --soil:#4a3728;
    --soil-soft:#7a6a58;
    --sky-1:#f4d798;
    --sky-2:#e8a666;
    --sky-3:#c97b53;
    font-family:"Public Sans", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#1c1a14;
      --cream-2:#242019;
      --soil:#efe8d6;
      --soil-soft:#c9bfa8;
    }
  }
  :root[data-theme="dark"]{
    --cream:#1c1a14;
    --cream-2:#242019;
    --soil:#efe8d6;
    --soil-soft:#c9bfa8;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:var(--cream);
    color:var(--soil);
    display:flex;
    align-items:stretch;
    justify-content:center;
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    max-width:1180px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1.15fr 1fr;
    min-height:100vh;
  }
  @media (max-width: 860px){
    .stage{ grid-template-columns:1fr; grid-template-rows:1fr; min-height:100vh; position:relative; }
    .scene{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      max-height:none;
      z-index:0;
    }
    .scene-caption{ display:none; }
    .panel{
      position:relative;
      z-index:1;
      background:transparent;
      min-height:100vh;
      align-items:flex-end;
      padding:24px 18px calc(28px + env(safe-area-inset-bottom, 0px));
    }
    .form-wrap{
      background:rgba(248,244,232,.78);
      -webkit-backdrop-filter:blur(16px) saturate(140%);
      backdrop-filter:blur(16px) saturate(140%);
      border:1px solid rgba(255,255,255,.35);
      border-radius:22px;
      padding:26px 22px;
      box-shadow:0 20px 50px -20px rgba(35,61,36,.45);
    }
    :root[data-theme="dark"] .form-wrap{
      background:rgba(28,26,20,.72);
      border-color:rgba(255,255,255,.08);
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme="light"]) .form-wrap{
        background:rgba(28,26,20,.72);
        border-color:rgba(255,255,255,.08);
      }
    }
  }

  /* ---------------- SCENE (left) ---------------- */
  .scene{
    position:relative;
    overflow:hidden;
    background:linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 55%, var(--sky-3) 100%);
  }
  .scene svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .sun{
    transform-origin:center;
    animation:rise 1.6s cubic-bezier(.22,.9,.34,1) both;
  }
  @keyframes rise{
    from{ transform:translateY(60px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }

  .hill-back{ animation:fadeUp 1s ease .1s both; }
  .hill-front{ animation:fadeUp 1s ease .25s both; }
  @keyframes fadeUp{
    from{ transform:translateY(24px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }

  .stalk{
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation:sway 3.2s ease-in-out infinite;
  }
  .stalk:nth-child(3n){ animation-duration:3.8s; }
  .stalk:nth-child(4n){ animation-duration:2.7s; animation-delay:.3s; }
  .stalk:nth-child(5n){ animation-duration:3.5s; animation-delay:.6s; }
  @keyframes sway{
    0%,100%{ transform:rotate(-8deg); }
    50%{ transform:rotate(8deg); }
  }
  .sun{
    transform-box:fill-box;
    transform-origin:50% 50%;
  }
  .sun.glow{
    animation:rise 1.6s cubic-bezier(.22,.9,.34,1) both, pulse 3.4s ease-in-out 1.6s infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:0.9; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.05); }
  }

  .seed{
    animation:drift linear infinite;
    opacity:.75;
  }
  @keyframes drift{
    0%{ transform:translate(0,0); opacity:0; }
    10%{ opacity:.8; }
    90%{ opacity:.6; }
    100%{ transform:translate(14px,-190px); opacity:0; }
  }

  .scene-caption{
    position:absolute;
    left:36px;
    bottom:38px;
    color:#fff;
    max-width:320px;
    animation:fadeUp 1s ease .5s both;
  }
  .scene-caption .eyebrow-word{
    font-family:"Fraunces", serif;
    font-size:clamp(28px, 3vw, 38px);
    font-weight:500;
    line-height:1.15;
    margin:0 0 8px;
    text-shadow:0 2px 18px rgba(74,45,20,.25);
  }
  .scene-caption p{
    margin:0;
    font-size:14.5px;
    line-height:1.55;
    color:rgba(255,255,255,.88);
    text-shadow:0 1px 12px rgba(74,45,20,.2);
  }

  @media (prefers-reduced-motion: reduce){
    .stalk, .sun, .hill-back, .hill-front, .seed, .scene-caption{ animation:none !important; }
  }

  /* ---------------- FORM (right) ---------------- */
  .panel{
    background:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 40px;
  }
  .form-wrap{
    width:100%;
    max-width:360px;
    animation:panelIn .7s cubic-bezier(.22,.9,.34,1) .2s both;
  }
  @keyframes panelIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .form-wrap{ animation:none; }
  }

  .mark{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:36px;
  }
  .mark svg{ width:26px; height:26px; flex:none; }
  .mark span{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:19px;
    color:var(--forest);
    letter-spacing:.2px;
  }
  :root[data-theme="dark"] .mark span,
  @media (prefers-color-scheme:dark){ }

  h1{
    font-family:"Fraunces", serif;
    font-weight:500;
    font-size:clamp(26px, 2.6vw, 31px);
    line-height:1.2;
    margin:0 0 8px;
    color:var(--soil);
  }
  .sub{
    margin:0 0 34px;
    color:var(--soil-soft);
    font-size:14.5px;
    line-height:1.5;
  }

  .field{ margin-bottom:20px; position:relative; }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--soil);
    margin-bottom:7px;
  }
  .input-shell{
    position:relative;
    display:flex;
    align-items:center;
    border-radius:11px;
    background:var(--cream-2);
    border:1.5px solid transparent;
    transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .input-shell:focus-within{
    border-color:var(--sage);
    background:var(--cream);
    box-shadow:0 0 0 4px rgba(122,150,96,.16);
  }
  .input-shell svg.icon{
    width:18px; height:18px;
    margin-left:14px;
    flex:none;
    color:var(--soil-soft);
    transition:color .2s ease;
  }
  .input-shell:focus-within svg.icon{ color:var(--forest-2); }

  input{
    width:100%;
    border:none;
    background:transparent;
    outline:none;
    padding:13px 12px;
    font-size:15px;
    font-family:"Public Sans", sans-serif;
    color:var(--soil);
  }
  input::placeholder{ color:var(--soil-soft); opacity:.7; }

  .toggle-pass{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--soil-soft);
    display:flex;
    align-items:center;
    padding:0 13px;
    flex:none;
  }
  .toggle-pass svg{ width:18px; height:18px; }
  .toggle-pass:hover{ color:var(--forest-2); }

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:2px 0 28px;
    font-size:13px;
  }
  .remember{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--soil-soft);
    cursor:pointer;
    user-select:none;
  }
  .remember input[type="checkbox"]{
    appearance:none;
    width:16px; height:16px;
    border-radius:5px;
    border:1.5px solid #b9ad93;
    display:grid;
    place-content:center;
    cursor:pointer;
    margin:0;
    padding:0;
    flex:none;
  }
  .remember input[type="checkbox"]::after{
    content:"";
    width:9px; height:9px;
    transform:scale(0);
    transition:transform .15s ease;
    border-radius:2px;
    background:var(--forest-2);
  }
  .remember input[type="checkbox"]:checked{ border-color:var(--forest-2); }
  .remember input[type="checkbox"]:checked::after{ transform:scale(1); }

  .link{
    color:var(--forest-2);
    text-decoration:none;
    font-weight:600;
  }
  .link:hover{ text-decoration:underline; }

  button.submit{
    width:100%;
    border:none;
    border-radius:11px;
    padding:14px 18px;
    background:var(--forest-2);
    color:#f8f4e8;
    font-family:"Public Sans", sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    position:relative;
    overflow:hidden;
    transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
    box-shadow:0 10px 24px -12px rgba(45,74,43,.55);
  }
  button.submit:hover{ background:var(--forest); transform:translateY(-1px); }
  button.submit:active{ transform:translateY(0); }
  button.submit svg{ width:17px; height:17px; transition:transform .35s ease; }
  button.submit:hover svg{ transform:translateX(3px) rotate(6deg); }

  button.submit.loading svg.sprout{ animation:grow .9s ease-in-out infinite alternate; }
  @keyframes grow{ from{ transform:scaleY(.7) translateY(2px); } to{ transform:scaleY(1) translateY(0); } }

  .foot-note{
    margin-top:26px;
    text-align:center;
    font-size:13px;
    color:var(--soil-soft);
    line-height:1.6;
  }

  .error{
    display:none;
    align-items:center;
    gap:8px;
    background:rgba(201,123,83,.12);
    border:1px solid rgba(201,123,83,.35);
    color:#a24a2c;
    padding:10px 12px;
    border-radius:9px;
    font-size:13px;
    margin-bottom:18px;
  }
  .error.show{ display:flex; }
  .error svg{ width:15px; height:15px; flex:none; }

  :focus-visible{ outline:2px solid var(--forest-2); outline-offset:2px; }
</style>
</head>
<body>
<div class="stage">

  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMax slice">
      <circle class="sun glow" cx="440" cy="150" r="78" fill="#fbe7ae" opacity="0.9"/>
      <circle class="sun" cx="440" cy="150" r="52" fill="#fdf1cf"/>

      <path class="hill-back" d="M0,430 C120,380 220,410 320,395 C420,380 520,400 600,370 L600,800 L0,800 Z" fill="#8a9d5f" opacity="0.55"/>
      <path class="hill-front" d="M0,480 C100,440 240,470 340,450 C450,428 540,455 600,435 L600,800 L0,800 Z" fill="#5f7a45"/>

      <g stroke="#3f5a34" stroke-width="2" stroke-linecap="round">
        <g class="stalk" transform="translate(40,560)"><line x1="0" y1="0" x2="0" y2="-90"/><circle cx="0" cy="-92" r="5" fill="#e3b74f"/></g>
        <g class="stalk" transform="translate(70,575)"><line x1="0" y1="0" x2="0" y2="-105"/><circle cx="0" cy="-107" r="5.5" fill="#e8a666"/></g>
        <g class="stalk" transform="translate(102,555)"><line x1="0" y1="0" x2="0" y2="-85"/><circle cx="0" cy="-87" r="5" fill="#e3b74f"/></g>
        <g class="stalk" transform="translate(135,580)"><line x1="0" y1="0" x2="0" y2="-110"/><circle cx="0" cy="-112" r="5.5" fill="#f0d089"/></g>
        <g class="stalk" transform="translate(165,560)"><line x1="0" y1="0" x2="0" y2="-92"/><circle cx="0" cy="-94" r="5" fill="#e3b74f"/></g>
        <g class="stalk" transform="translate(198,585)"><line x1="0" y1="0" x2="0" y2="-100"/><circle cx="0" cy="-102" r="5.5" fill="#e8a666"/></g>
        <g class="stalk" transform="translate(228,565)"><line x1="0" y1="0" x2="0" y2="-88"/><circle cx="0" cy="-90" r="5" fill="#f0d089"/></g>
        <g class="stalk" transform="translate(260,590)"><line x1="0" y1="0" x2="0" y2="-112"/><circle cx="0" cy="-114" r="5.5" fill="#e3b74f"/></g>
        <g class="stalk" transform="translate(292,568)"><line x1="0" y1="0" x2="0" y2="-90"/><circle cx="0" cy="-92" r="5" fill="#e8a666"/></g>
        <g class="stalk" transform="translate(322,585)"><line x1="0" y1="0" x2="0" y2="-105"/><circle cx="0" cy="-107" r="5.5" fill="#f0d089"/></g>
        <g class="stalk" transform="translate(10,548)"><line x1="0" y1="0" x2="0" y2="-78"/><circle cx="0" cy="-80" r="4.5" fill="#e3b74f"/></g>
        <g class="stalk" transform="translate(355,570)"><line x1="0" y1="0" x2="0" y2="-92"/><circle cx="0" cy="-94" r="5" fill="#e3b74f"/></g>
        <g class="stalk" transform="translate(385,595)"><line x1="0" y1="0" x2="0" y2="-108"/><circle cx="0" cy="-110" r="5.5" fill="#e8a666"/></g>
        <g class="stalk" transform="translate(415,572)"><line x1="0" y1="0" x2="0" y2="-90"/><circle cx="0" cy="-92" r="5" fill="#f0d089"/></g>
        <g class="stalk" transform="translate(445,592)"><line x1="0" y1="0" x2="0" y2="-104"/><circle cx="0" cy="-106" r="5.5" fill="#e3b74f"/></g>
        <g class="stalk" transform="translate(475,575)"><line x1="0" y1="0" x2="0" y2="-95"/><circle cx="0" cy="-97" r="5" fill="#e8a666"/></g>
        <g class="stalk" transform="translate(505,598)"><line x1="0" y1="0" x2="0" y2="-112"/><circle cx="0" cy="-114" r="5.5" fill="#f0d089"/></g>
        <g class="stalk" transform="translate(535,578)"><line x1="0" y1="0" x2="0" y2="-92"/><circle cx="0" cy="-94" r="5" fill="#e3b74f"/></g>
        <g class="stalk" transform="translate(565,600)"><line x1="0" y1="0" x2="0" y2="-108"/><circle cx="0" cy="-110" r="5.5" fill="#e8a666"/></g>
        <g class="stalk" transform="translate(590,580)"><line x1="0" y1="0" x2="0" y2="-90"/><circle cx="0" cy="-92" r="5" fill="#f0d089"/></g>
      </g>

      <path d="M0,590 C120,560 220,600 320,580 C420,562 520,595 600,575 L600,800 L0,800 Z" fill="#4a6134"/>

      <g class="seed" fill="#f0d089" style="animation-duration:7s; animation-delay:.2s;"><circle cx="120" cy="620" r="2.2"/></g>
      <g class="seed" fill="#fdf1cf" style="animation-duration:9s; animation-delay:1.6s;"><circle cx="260" cy="640" r="1.8"/></g>
      <g class="seed" fill="#f0d089" style="animation-duration:8s; animation-delay:3s;"><circle cx="400" cy="610" r="2"/></g>
      <g class="seed" fill="#fdf1cf" style="animation-duration:10s; animation-delay:.8s;"><circle cx="480" cy="650" r="1.6"/></g>
      <g class="seed" fill="#f0d089" style="animation-duration:7.5s; animation-delay:2.4s;"><circle cx="340" cy="630" r="2"/></g>
    </svg>

    <div class="scene-caption">
      <p class="eyebrow-word">Coltiva ogni giorno<br>un raccolto migliore.</p>
      <p>Gestisci l'irrigazione di tutti i tuoi campi in un'unica app.</p>
    </div>
  </div>

  <div class="panel">
    <div class="form-wrap">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 21c0-6 4-8 8-9-1 6-3 9-8 9Z" fill="#7a9660"/>
          <path d="M12 21c0-7-4-10-9-11 1 7 4 11 9 11Z" fill="#2d4a2b"/>
        </svg>
        <span>Login</span>
      </div>

      <h1>Bentornato nel tuo sistema di automazione e monitoraggio irrigazione</h1>
      <p class="sub">Accedi per continuare a seguire colture e attività.</p>

      <div class="error" id="errorBox" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16" r="0.6" fill="currentColor"/></svg>
        <span>Nome utente o password non corretti. Riprova.</span>
      </div>

      <form id="loginForm" action="/login.php" method="post" novalidate>
        <div class="field">
          <label for="username">Nome utente</label>
          <div class="input-shell">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.3-4 4-6 7.5-6s6.2 2 7.5 6"/></svg>
            <input id="username" name="username" type="text" placeholder="nome utente" autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-shell">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10.5" width="14" height="9.5" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostra password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        

        <button type="submit" class="submit" id="submitBtn">
          <span id="btnLabel">Accedi</span>
          <svg class="sprout" id="btnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      
    </div>
  </div>

</div>

<script>
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const btnLabel = document.getElementById('btnLabel');
  const btnIcon = document.getElementById('btnIcon');
  const errorBox = document.getElementById('errorBox');
  const togglePass = document.getElementById('togglePass');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  togglePass.addEventListener('click', () => {
    const isPass = passwordInput.type === 'password';
    passwordInput.type = isPass ? 'text' : 'password';
    togglePass.setAttribute('aria-label', isPass ? 'Nascondi password' : 'Mostra password');
    eyeIcon.innerHTML = isPass
      ? '<path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M6.5 6.9C3.9 8.6 1.5 12 1.5 12s3.5 7 10.5 7c1.9 0 3.5-.4 4.9-1.1"/><path d="M17.5 6.9C16 5.8 14.1 5 12 5c-.6 0-1.1.05-1.7.15"/>'
      : '<path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/>';
  });
</script>
</body>
</html>
